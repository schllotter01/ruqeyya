<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Çox ciddi sual... 🧐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            padding: 20px;
            color: #f8fafc;
        }

        /* Glassmorphism kart */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 360px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .emoji {
            font-size: 55px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.3));
        }

        h1 {
            color: #38bdf8;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.4;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 70px;
            position: relative;
        }

        button {
            padding: 14px 30px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s, box-shadow 0.2s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        #heBtn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            z-index: 50;
            transform-origin: center;
        }

        #heBtn:active {
            transform: scale(0.95);
        }

        #yoxBtn {
            background: linear-gradient(135deg, #475569 0%, #334155 100%);
            color: #cbd5e1;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: absolute;
            z-index: 999;
        }

        /* Nəticə Ekranı */
        .success-message {
            display: none;
        }

        .success-message h2 {
            color: #34d399;
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 800;
        }

        .success-message p {
            color: #94a3b8;
            font-size: 17px;
            line-height: 1.5;
        }

        /* Konfetti Konteyneri */
        canvas#confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <canvas id="confetti"></canvas>

    <div class="card" id="mainCard">
        <div class="emoji">🕵️‍♂️✨</div>
        <h1>Ciddi bir məsələ var...<br>Aramızdakı bu xüsusi bağı hiss edirsən?</h1>
        
        <div class="btn-group" id="btnGroup">
            <button id="heBtn">Əlbəttə! 😎</button>
            <button id="yoxBtn">Xeyr 🤐</button>
        </div>
    </div>

    <div class="card success-message" id="successCard">
        <div class="emoji">🚀🔥🎉</div>
        <h2>BİLİRDİM! </h2>
        <p>Ən doğru seçim! Birlikdə super komandayıq! 😉</p>
    </div>

    <script>
        const yoxBtn = document.getElementById('yoxBtn');
        const heBtn = document.getElementById('heBtn');
        const mainCard = document.getElementById('mainCard');
        const successCard = document.getElementById('successCard');

        let heScale = 1; // "Hə" düyməsinin böyümə miqyası

        function initYoxPos() {
            yoxBtn.style.left = (heBtn.offsetLeft + heBtn.offsetWidth + 15) + 'px';
            yoxBtn.style.top = heBtn.offsetTop + 'px';
        }

        window.onload = initYoxPos;

        // "Yox"a toxunanda: Düymə qaçır VƏ "Hə" düyməsi böyüyür!
        function moveButton(e) {
            if (e) e.preventDefault();

            // 1. "Hə" düyməsini böyüt
            heScale += 0.25;
            heBtn.style.transform = `scale(${heScale})`;

            // 2. "Yox" düyməsini başqa yerə qaçırt
            const padding = 30;
            const btnWidth = yoxBtn.offsetWidth;
            const btnHeight = yoxBtn.offsetHeight;

            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            yoxBtn.style.position = 'fixed';
            yoxBtn.style.left = `${randomX}px`;
            yoxBtn.style.top = `${randomY}px`;
        }

        yoxBtn.addEventListener('touchstart', moveButton, { passive: false });
        yoxBtn.addEventListener('mouseover', moveButton);
        yoxBtn.addEventListener('click', moveButton);

        // "Hə" basıldıqda
        heBtn.addEventListener('click', () => {
            mainCard.style.display = 'none';
            yoxBtn.style.display = 'none';
            successCard.style.display = 'block';
            startConfetti(); // Feyerverk effektini başlat
        });

        // ----------------
        // KONFETTİ EFFEKTİ
        // ----------------
        function startConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const colors = ['#38bdf8', '#34d399', '#fbbf24', '#a855f7', '#f43f5e'];

            for (let i = 0; i < 120; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 5 + 2,
                    angle: Math.random() * 360
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach((p) => {
                    ctx.save();
                    ctx.beginPath();
                    ctx.fillStyle = p.color;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle);
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();

                    p.y += p.speed;
                    p.angle += 0.05;

                    if (p.y > canvas.height) {
                        p.y = -10;
                        p.x = Math.random() * canvas.width;
                    }
                });
                requestAnimationFrame(draw);
            }
            draw();
        }
    </script>
</body>
</html>
